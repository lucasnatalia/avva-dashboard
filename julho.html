<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVVA · Relatório de Julho</title>
<style>
  :root{
    --marrom:#655244; --marrom-esc:#655244; --escuro:#655244;
    --creme:#F5F0E8; --branco:#FEFAF6; --areia:#EBE2D2; --areia-esc:#696E54;
    --ink:#655244; --sub:rgba(101,82,68,.65); --linha:#EBE2D2;
    --pos:#696E54; --pos-bg:#EDE8DF; --warn:#655244; --warn-bg:#EBE2D2; --neg:#655244;
    --mitr:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --lato:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--mitr);font-weight:500;font-size:14px;line-height:1.45;background:var(--creme);color:var(--ink);-webkit-font-smoothing:antialiased;padding:28px clamp(16px,4vw,56px) 0}
  ::selection{background:var(--areia);color:var(--marrom-esc)}
  .wrap{max-width:1240px;margin:0 auto}

  /* ---------- hero escuro ---------- */
  #hero{background:var(--escuro);border-radius:28px;padding:clamp(32px,5vw,56px);position:relative;overflow:hidden}
  #hero .h-in{position:relative}
  .logo svg{height:clamp(30px,4.5vw,44px);width:auto;display:block}
  .h-sub{font-weight:500;font-size:15px;letter-spacing:.06em;color:rgba(254,250,246,.8);margin-top:16px}
  .h-sub b{font-weight:700;color:var(--creme)}
  .pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(235,226,210,.55);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;color:#EDE8DF}
  .pill .dot{width:10px;height:10px;border-radius:50%;background:var(--areia)}
  .pill.ok .dot{background:#696E54}

  /* ---------- kickers e títulos (gramática do site) ---------- */
  .kicker{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--areia-esc);font-weight:700;margin:52px 0 6px}
  .sect-h{font-weight:800;letter-spacing:-0.5px;font-size:clamp(24px,3.2vw,34px);color:var(--marrom-esc);line-height:1.15;margin-bottom:18px}
  .sect-h em{font-style:italic;font-weight:600}

  /* ---------- banner meta ---------- */
  .banner{background:var(--marrom-esc);border-radius:24px;padding:clamp(28px,4vw,44px);display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
  .banner .bnum{font-weight:900;letter-spacing:-1px;font-size:clamp(52px,8vw,84px);line-height:1;color:var(--areia)}
  .banner .bsub{font-size:14.5px;color:rgba(254,250,246,.75);margin-top:12px;font-weight:500}
  .banner .bside{display:flex;gap:40px;text-align:right}
  .banner .bs .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(254,250,246,.55);font-weight:500}
  .banner .bs .v{font-weight:800;letter-spacing:-0.5px;font-size:34px;color:var(--creme);margin-top:4px}

  /* ---------- insights em grade ---------- */
  .ins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-top:14px}
  .ins{background:var(--branco);border:1px solid var(--linha);border-radius:20px;padding:26px 26px 24px;position:relative;overflow:hidden;transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s cubic-bezier(.22,1,.36,1)}
  .ins:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(101,82,68,.28)}
  .ins::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--pos)}
  .ins.warn{background:#EDE8DF;border-color:#EBE2D2}
  .ins.warn::before{background:var(--marrom)}
  .ins .ic{width:36px;height:36px;border-radius:50%;background:var(--pos);color:#FEFAF6;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
  .ins.warn .ic{background:var(--marrom)}
  .ins .t{font-weight:800;font-size:16.5px;letter-spacing:-0.3px;color:var(--pos);margin:14px 0 8px;line-height:1.25}
  .ins.warn .t{color:var(--marrom)}
  .ins .d{font-size:13.5px;color:rgba(101,82,68,.85);line-height:1.55}

  /* ---------- divisor de trimestre e metas ---------- */
  .divisor{background:var(--marrom);border-radius:28px;padding:clamp(36px,5vw,56px);margin-top:76px;text-align:center}
  .divisor .dk{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#EBE2D2;font-weight:700;opacity:.85}
  .divisor .dt{font-size:clamp(30px,4.5vw,46px);font-weight:900;letter-spacing:-1px;color:#FEFAF6;margin-top:10px;line-height:1.1}
  .divisor .ds{font-size:14.5px;color:rgba(254,250,246,.75);margin-top:12px;font-weight:500}
  .metas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:14px}
  .mcard{background:var(--branco);border:1px solid var(--linha);border-radius:20px;padding:30px 28px}
  .mcard .lblm{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--areia-esc);font-weight:700}
  .mcard .mval{font-size:clamp(44px,6vw,58px);font-weight:900;letter-spacing:-1px;color:var(--marrom);line-height:1.05;margin-top:8px}
  .mcard .mval small{font-size:14px;font-weight:600;color:rgba(101,82,68,.65);letter-spacing:0;margin-left:8px}
  .mbar{height:32px;border-radius:999px;background:#EDE8DF;margin-top:32px;position:relative}
  .mmark{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--marrom);border-radius:2px;z-index:2}
  .mmark.ago{background:var(--areia-esc)}
  .mlab{position:absolute;top:-24px;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;font-weight:800;color:var(--areia-esc);text-transform:uppercase;z-index:2}
  .chipmeta{background:var(--areia-esc);color:#FEFAF6;border-radius:999px;padding:2.5px 11px;font-weight:800;font-size:11.5px;margin-left:4px}
  .mcap2{font-size:11.5px;color:rgba(101,82,68,.7);margin-top:9px;font-weight:500}
  .mcap2 b{color:var(--marrom);font-weight:800}
  .mfill{height:100%;border-radius:999px;overflow:hidden;background:linear-gradient(90deg,#696E54,rgba(105,110,84,.85));display:flex;align-items:center;justify-content:flex-end;padding:0 14px;color:#FEFAF6;font-weight:800;font-size:14px;letter-spacing:-0.2px;min-width:58px}
  .mends{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;font-weight:600;color:rgba(101,82,68,.75)}
  .mends b{color:var(--marrom);font-weight:800}

  /* ---------- entregas ---------- */
  .ent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:14px;align-items:start}
  .ecard{background:var(--branco);border:1px solid var(--linha);border-radius:20px;overflow:hidden}
  .ecard .ehead{background:#EBE2D2;padding:13px 24px;font-weight:700;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--areia-esc);display:flex;justify-content:space-between;align-items:center}
  .ecard .ehead .en{font-size:11px;background:var(--areia-esc);color:#FEFAF6;border-radius:999px;padding:2px 10px}
  .ecard ul{list-style:none;padding:4px 0}
  .ecard li{display:flex;gap:12px;align-items:flex-start;padding:13px 24px;border-bottom:1px solid rgba(235,226,210,.55)}
  .ecard li:last-child{border-bottom:none}
  .echk{width:20px;height:20px;border-radius:50%;background:var(--pos);color:#FEFAF6;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
  .ename{font-size:13.5px;color:rgba(101,82,68,.85);line-height:1.45;font-weight:500}
  .ename a{color:var(--areia-esc);text-decoration:none;font-weight:700;margin-left:6px;white-space:nowrap}
  .ecard.pend .ehead{background:#EDE8DF}
  .echk.p{background:transparent;border:2px dashed var(--areia-esc)}
  .etag{font-size:10px;background:#EBE2D2;border-radius:999px;padding:2.5px 9px;color:var(--areia-esc);font-weight:700;margin-left:8px;white-space:nowrap;letter-spacing:.03em}
  .eprio{font-size:9.5px;background:var(--areia-esc);border-radius:999px;padding:2.5px 9px;color:#FEFAF6;font-weight:800;margin-left:8px;white-space:nowrap;letter-spacing:.12em;text-transform:uppercase}

  /* ---------- nota ---------- */
  .callout{border-radius:18px;padding:20px 24px;display:flex;gap:16px;align-items:flex-start}
  .callout.warn{background:#EDE8DF}
  .callout .ic{width:36px;height:36px;border-radius:50%;background:var(--marrom);color:#FEFAF6;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
  .callout .t{font-weight:800;font-size:15px;color:var(--marrom)}
  .callout .d{font-size:13.5px;color:rgba(101,82,68,.85);margin-top:3px;line-height:1.5}

  /* ---------- funil do site ---------- */
  .fun{background:var(--branco);border:1px solid var(--linha);border-radius:20px;padding:26px 28px;margin-top:14px}
  .frow{display:grid;grid-template-columns:minmax(150px,220px) 1fr 130px;gap:16px;align-items:center;padding:9px 0}
  .fname{font-size:13.5px;font-weight:600;color:var(--marrom)}
  .ftrack{position:relative;height:40px}
  .fbar{height:100%;border-radius:10px;background:var(--marrom);display:flex;align-items:center;justify-content:flex-end;padding:0 14px;color:#FEFAF6;font-weight:800;font-size:14px;letter-spacing:-0.3px;min-width:64px;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
  .frow:nth-child(even) .fbar{background:var(--areia-esc)}
  .pre .fbar{width:64px!important}
  .fbar.ghost{background:transparent;border:2px dashed rgba(105,110,84,.45);color:var(--areia-esc);font-weight:600;font-size:12px;justify-content:center;letter-spacing:.04em}
  .fpct{font-size:12px;font-weight:700;color:var(--areia-esc);text-align:right}
  .frow.pj{grid-template-columns:minmax(210px,320px) 1fr 100px;padding:12px 0}
  .fdesc{display:block;font-size:11px;font-weight:500;color:rgba(101,82,68,.65);line-height:1.4;margin-top:3px}
  .funil{display:flex;flex-direction:column;align-items:center;gap:0;margin:22px auto 6px;max-width:760px}
  .fstage{clip-path:polygon(0 0,100% 0,95% 100%,5% 100%);border-radius:10px;height:74px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;text-align:center;transition:transform 1s cubic-bezier(.22,1,.36,1)}
  .fstage .fk{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;opacity:.85}
  .fstage .fv{font-size:23px;font-weight:800;letter-spacing:-0.5px;line-height:1.1}
  .fstage .fv small{font-size:11.5px;font-weight:600;opacity:.8;margin-left:7px;letter-spacing:0}
  .fstage.solid{background:linear-gradient(180deg,#655244,rgba(101,82,68,.88));color:#FEFAF6;box-shadow:0 10px 22px -14px rgba(101,82,68,.6)}
  .fstage.fim{background:linear-gradient(180deg,#696E54,rgba(105,110,84,.88));color:#FEFAF6;box-shadow:0 12px 24px -14px rgba(105,110,84,.7)}
  .fstage.aguarda{background:#EBE2D2;color:var(--areia-esc)}
  .fstage.aguarda .fv{font-size:15px;font-weight:700;letter-spacing:.02em}
  .pre .fstage{transform:scaleX(.25)}
  .in .fstage{transform:scaleX(1)}
  .farrow{color:var(--areia-esc);font-size:15px;line-height:1;padding:5px 0;opacity:.7}
  .pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
  .pcard{background:#FEFAF6;border:1px solid var(--linha);border-radius:16px;padding:20px 20px 18px}
  .pcard .pn{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--areia-esc);font-weight:700}
  .pcard .pv{font-size:34px;font-weight:900;letter-spacing:-0.5px;color:var(--marrom);line-height:1.1;margin-top:6px}
  .pcard .pv small{font-size:11px;font-weight:600;color:rgba(101,82,68,.6);margin-left:6px;letter-spacing:0}
  .pcard .pbar{height:7px;border-radius:999px;background:#EDE8DF;margin:14px 0 12px;overflow:hidden}
  .pcard .pfill{height:100%;border-radius:999px;background:var(--marrom);transition:width 1.1s cubic-bezier(.22,1,.36,1)}
  .pre .pcard .pfill{width:0!important}
  .pcard .pconv{font-size:12.5px;font-weight:700;color:var(--pos)}
  .pcard .pconv.zero{color:rgba(101,82,68,.5);font-weight:500}
  .pcard .pconv span{display:block;font-weight:500;color:rgba(101,82,68,.6);font-size:11px;margin-top:1px}
  .fsplit{display:flex;gap:16px;width:90%;justify-content:center}
  .fsplit .fcol{flex:1;display:flex;flex-direction:column;gap:0}
  .fsplit .fcol .fstage{width:100%!important;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}
  .fsplit .fcol .farrow{text-align:center}
  .flab{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--areia-esc);font-weight:700;text-align:center;padding:0 0 8px;display:flex;align-items:center;gap:10px;justify-content:center}
  .flab::before,.flab::after{content:'';height:1.5px;background:var(--areia);flex:1;max-width:60px}
  .fpct span{display:block;font-weight:500;color:var(--sub);font-size:10.5px;letter-spacing:.04em}

  /* ---------- painel leitura do período ---------- */
  .panel{background:var(--marrom);border-radius:24px;padding:clamp(28px,4vw,42px);margin-top:22px}
  .panel .pk{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#EBE2D2;font-weight:700;opacity:.85}
  .panel .pt2{font-weight:800;letter-spacing:-0.5px;font-size:clamp(19px,2.4vw,24px);color:#FEFAF6;margin:10px 0 12px;line-height:1.25}
  .panel .pd{font-size:15px;line-height:1.65;color:rgba(254,250,246,.85);max-width:900px}
  .panel .pd b{color:#EBE2D2;font-weight:700}

  /* ---------- cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
  .card{background:var(--branco);border:1px solid var(--linha);border-radius:18px;padding:24px 24px 20px;transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s cubic-bezier(.22,1,.36,1)}
  .card:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(101,82,68,.28)}
  .card .lbl{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:10px}
  .card .val{font-weight:800;letter-spacing:-0.5px;font-size:40px;line-height:1.05;color:var(--marrom-esc)}
  .card .dl{font-size:12.5px;margin-top:8px;font-weight:500}
  .dl.up{color:var(--pos)} .dl.dn{color:var(--neg)} .dl.nt{color:var(--sub);font-weight:500}
  .dl span{font-weight:500;color:var(--sub)}

  /* ---------- pilar head ---------- */
  .phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:52px}
  .phead .kicker{margin:0 0 6px}
  .phead .kpi-tag{margin-left:auto;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--areia-esc);font-weight:500;padding-bottom:24px}
  .ex-tag{font-size:12.5px;color:var(--sub);font-style:italic;padding-bottom:24px}

  /* ---------- charts ---------- */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .chartbox{background:var(--branco);border:1px solid var(--linha);border-radius:18px;padding:24px 24px 14px}
  .chartbox h3{font-weight:700;font-size:14.5px;color:var(--marrom);margin-bottom:14px}
  .chartbox svg{width:100%;height:auto;display:block}
  svg text{font-family:var(--mitr);font-weight:600}
  svg .pt{transition:transform .3s cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center;cursor:pointer}
  svg .pt:hover{transform:scale(1.8)}
  svg .bar{transition:transform 1s cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center bottom}
  svg .trace{transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)}
  svg .dlab{transition:opacity .8s ease .6s}
  .pre svg .bar{transform:scaleY(.001)}
  .pre svg .trace{stroke-dashoffset:1}
  .pre svg .dlab{opacity:0}

  /* ---------- quebra entre seções ---------- */
  #banner-area section+section{border-top:1.5px solid var(--areia);margin-top:60px;padding-top:8px}
  #insights:not(:empty){border-top:1.5px solid var(--areia);margin-top:60px;padding-top:8px}
  #insights section{border-top:1.5px solid var(--areia);margin-top:60px;padding-top:8px}
  #dash section{border-top:1.5px solid var(--areia);margin-top:60px;padding-top:8px}
  #dash section:first-child{margin-top:0}

  /* ---------- reveal ---------- */
  .pre{opacity:0;transform:translateY(26px)}
  .rv{transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
  .in{opacity:1;transform:none}
  .in svg .bar{transform:scaleY(1)}
  .in svg .trace{stroke-dashoffset:0}
  .in svg .dlab{opacity:1}

  /* ---------- tabelas mensais por grupo ---------- */
  .gcard{background:var(--branco);border:1px solid var(--linha);border-radius:20px;overflow:hidden;margin-top:18px;box-shadow:0 12px 32px -28px rgba(101,82,68,.4)}
  .gcard .ghead{background:#EBE2D2;padding:13px 26px;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--areia-esc);font-weight:700}
  .gwrap{overflow-x:auto}
  .gt{width:100%;border-collapse:collapse;min-width:540px;table-layout:fixed}
  .gt col.c-lbl{width:30%}
  .gt th{padding:16px 26px 12px;text-align:right;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);font-weight:500;border-bottom:1.5px solid var(--areia);vertical-align:bottom}
  .gt th:first-child{text-align:left}
  .gt th.cur{background:var(--areia-esc);color:#FEFAF6;border-bottom-color:var(--areia-esc)}
  .gt th.cur .thtag{display:block;font-size:8.5px;letter-spacing:.18em;color:rgba(254,250,246,.75);margin-bottom:3px}
  .gt td{padding:15px 26px;text-align:right;font-size:15px;color:rgba(101,82,68,.75);border-bottom:1px solid rgba(235,226,210,.5);font-variant-numeric:tabular-nums;letter-spacing:-0.2px}
  .gt td:first-child{text-align:left;color:var(--marrom);font-size:13.5px;letter-spacing:0}
  .gt tr:last-child td{border-bottom:none}
  .gt td.cur{background:rgba(105,110,84,.08);font-weight:700;color:var(--marrom);font-size:16.5px}
  .gt td.cur .cd{display:block;font-size:11px;font-weight:500;margin-top:4px;letter-spacing:0}
  .gt td.cur .cd.up{color:var(--pos)} .gt td.cur .cd.dn{color:var(--neg);opacity:.65}
  .gt tr.hl td{background:#EDE8DF;font-weight:700;color:var(--marrom)}
  .gt tr.hl td.cur{background:rgba(105,110,84,.16)}
  .gt tr.hl td:first-child{font-weight:500}
  .gt tr.neg td{color:#B0413E}
  .gt tr.neg td:first-child{color:var(--marrom)}
  .gt tr.neg td.cur{color:#B0413E}

  /* ---------- melhores conteúdos ---------- */
  .ccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .ccard{background:var(--branco);border:1px solid var(--linha);border-radius:20px;padding:24px;position:relative;transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s cubic-bezier(.22,1,.36,1)}
  .ccard:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(101,82,68,.28)}
  .ccard.top{background:var(--marrom);border-color:var(--marrom)}
  .ccard .crank{font-weight:900;font-size:30px;letter-spacing:-0.5px;color:var(--areia);line-height:1}
  .ccard.top .crank{color:#EBE2D2}
  .ccard .cmeta{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .ccard .ctag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:#EDE8DF;color:var(--areia-esc);border-radius:999px;padding:4px 12px}
  .ccard.top .ctag{background:rgba(254,250,246,.16);color:#EBE2D2}
  .ccard .cmes{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
  .ccard.top .cmes{color:rgba(254,250,246,.6)}
  .ccard .cdesc{font-size:15.5px;line-height:1.45;color:var(--marrom);margin-top:12px;min-height:44px}
  .ccard.top .cdesc{color:#FEFAF6}
  .ccard .cmets{display:flex;gap:26px;margin-top:18px;border-top:1px solid var(--linha);padding-top:14px}
  .ccard.top .cmets{border-top-color:rgba(254,250,246,.18)}
  .ccard .cm .cv{font-weight:800;font-size:21px;color:var(--marrom-esc);letter-spacing:-0.3px}
  .ccard.top .cm .cv{color:#EBE2D2}

<script>
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var C1='#655244',C2='#696E54';

/* ---------- utilitários ---------- */
function num(v){if(typeof v==='number')return v;if(v==null||v==='-'||v==='')return null;var p=parseFloat(String(v).replace(/[R$\s.]/g,'').replace(',','.'));return isNaN(p)?null:p}
function colOf(row,frag){for(var k in row){if(k.indexOf(frag)>=0)return row[k]}return null}
var fmt={
  int:function(v){return v==null?'–':Math.round(v).toLocaleString('pt-BR')},
  dec:function(v){return v==null?'–':v.toLocaleString('pt-BR',{maximumFractionDigits:1})},
  pct:function(v){return v==null?'–':(v*100).toFixed(1).replace('.',',')+'%'},
  km:function(v){if(v==null)return '–';if(v>=1e6)return (v/1e6).toFixed(1).replace('.',',')+'M';if(v>=1e4){var k=v/1e3;return String(k>=100?Math.round(k):+k.toFixed(1)).replace('.',',')+'K'}return Math.round(v).toLocaleString('pt-BR')},
  plus:function(v){return v==null?'–':(v>=0?'+':'')+fmt.km(v)},
  tri:function(v){if(v==null)return '–';var s=v<0?'-':'+';v=Math.abs(v);var t;if(v>=1e6)t=(v/1e6).toFixed(1).replace('.',',')+'M';else if(v>=1e3){var k=v/1e3;t=String(k>=100?Math.round(k):+k.toFixed(1)).replace('.',',')+'K'}else t=String(Math.round(v));return s+t},
  trin:function(v){if(v==null)return '–';if(v>=1e6)return (v/1e6).toFixed(1).replace('.',',')+'M';if(v>=1e3){var k=v/1e3;return String(k>=100?Math.round(k):+k.toFixed(1)).replace('.',',')+'K'}return String(Math.round(v))}
};
function pctd(cur,prev){return (Math.abs((cur-prev)/Math.abs(prev))*100).toFixed(0)+'%'}
function delta(cur,prev,inverse){
  if(cur==null||prev==null||prev===0)return '<div class="dl nt">–</div>';
  var d=(cur-prev)/Math.abs(prev),up=d>=0,good=inverse?!up:up;
  return '<div class="dl '+(good?'up':'dn')+'">'+(up?'▲':'▼')+' '+(Math.abs(d)*100).toFixed(1).replace('.',',')+'% <span>vs mês anterior</span></div>';
}
function card(lbl,val,dl,raw,fk){
  var attr=(raw!=null&&fk)?' data-raw="'+raw+'" data-fmt="'+fk+'"':'';
  return '<div class="card"><div class="lbl">'+lbl+'</div><div class="val"'+attr+'>'+val+'</div>'+(dl||'')+'</div>';
}

/* ---------- gráficos SVG ---------- */
var W=480,H=252,PL=18,PR=18,PT=32,PB=38,IW=W-PL-PR,IH=H-PT-PB;
function grid(){
  var g='';
  for(var i=1;i<=3;i++){var y=PT+IH-(IH*i/3);g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#EDE8DF" stroke-width="1"/>'}
  g+='<line x1="'+PL+'" y1="'+(PT+IH)+'" x2="'+(W-PR)+'" y2="'+(PT+IH)+'" stroke="#EBE2D2" stroke-width="1"/>';
  return g;
}
function xlabels(labels){
  var n=labels.length,o='';
  for(var i=0;i<n;i++){var x=PL+(n===1?IW/2:i*IW/(n-1));o+='<text x="'+x+'" y="'+(H-18)+'" text-anchor="middle" font-size="10" font-weight="600" fill="rgba(101,82,68,.65)">'+labels[i]+'</text>'}
  return o;
}
function legend(series){
  if(series.length<2)return '';
  var o='',x=PL;
  series.forEach(function(s,i){
    o+='<circle cx="'+(x+3.5)+'" cy="'+(H-4)+'" r="3.5" fill="'+(i?C2:C1)+'"/><text x="'+(x+12)+'" y="'+(H-1)+'" font-size="9.5" font-weight="600" fill="rgba(101,82,68,.65)">'+s.label+'</text>';
    x+=12+s.label.length*5.8+20;
  });
  return o;
}
function svgLine(labels,series){
  var n=labels.length,out=grid()+xlabels(labels);
  var X=function(i){return PL+(n===1?IW/2:i*IW/(n-1))};
  series.forEach(function(s,si){
    var vals=s.data,present=vals.filter(function(v){return v!=null});
    if(!present.length)return;
    var mx=Math.max.apply(null,present); if(mx===0)mx=1;
    var Y=function(v){return PT+IH-(v/mx)*IH*0.9};
    var color=si?C2:C1,segs=[],seg=[];
    vals.forEach(function(v,i){ if(v==null){if(seg.length){segs.push(seg);seg=[]}} else seg.push([X(i),Y(v),v,i]) });
    if(seg.length)segs.push(seg);
    segs.forEach(function(pg){
      if(pg.length>1){
        var pts=pg.map(function(p){return p[0]+','+p[1]}).join(' ');
        var area=pts+' '+pg[pg.length-1][0]+','+(PT+IH)+' '+pg[0][0]+','+(PT+IH);
        out+='<polygon points="'+area+'" fill="'+color+'" opacity="0.07"/>';
        out+='<polyline class="trace" pathLength="1" stroke-dasharray="1" points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      }
      pg.forEach(function(p){
        out+='<circle class="pt" cx="'+p[0]+'" cy="'+p[1]+'" r="3.4" fill="'+color+'"><title>'+labels[p[3]]+' · '+s.label+' '+(s.fmt||fmt.km)(p[2])+'</title></circle>';
        var ly=si?p[1]+17:p[1]-9;
        out+='<text class="dlab" x="'+p[0]+'" y="'+ly+'" text-anchor="middle" font-size="10" font-weight="600" fill="'+color+'">'+(s.fmt||fmt.km)(p[2])+'</text>';
      });
    });
  });
  out+=legend(series);
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+out+'</svg>';
}
function svgBar(labels,series){
  var n=labels.length,out=grid()+xlabels(labels);
  var all=[];series.forEach(function(s){s.data.forEach(function(v){if(v!=null)all.push(v)})});
  if(!all.length)return '<svg viewBox="0 0 '+W+' '+H+'"></svg>';
  var mx=Math.max.apply(null,all); if(mx===0)mx=1;
  var groupW=IW/n, barW=Math.min(32,(groupW*0.5)/series.length);
  series.forEach(function(s,si){
    var color=si?C2:C1;
    s.data.forEach(function(v,i){
      if(v==null)return;
      var h=(v/mx)*IH*0.86;
      var cx=PL+i*groupW+groupW/2;
      var x=cx-(series.length*barW)/2+si*barW;
      out+='<rect class="bar" x="'+x+'" y="'+(PT+IH-h)+'" width="'+(barW-4)+'" height="'+h+'" rx="5" fill="'+color+'" opacity="0.92"><title>'+labels[i]+' · '+s.label+' '+(s.fmt||fmt.km)(v)+'</title></rect>';
      out+='<text class="dlab" x="'+(x+(barW-4)/2)+'" y="'+(PT+IH-h-6)+'" text-anchor="middle" font-size="10" font-weight="600" fill="'+color+'">'+(s.fmt||fmt.km)(v)+'</text>';
    });
  });
  out+=legend(series);
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+out+'</svg>';
}
function box(title,svg){return '<div class="chartbox"><h3>'+title+'</h3>'+svg+'</div>'}

/* ---------- leitura executiva (insights automáticos) ---------- */
function buildInsights(S){
  var pos=[],warn=[];
  var rows=(S.soc&&S.soc.data)?S.soc.data.filter(function(r){return num(colOf(r,'alcance'))!=null||num(colOf(r,'visualizações'))!=null}):[];
  var f=rows[0]||null,l=rows[rows.length-1]||null,p=rows.length>1?rows[rows.length-2]:null;
  var somar=function(frag){var t=0,has=false;rows.forEach(function(r){var v=num(colOf(r,frag));if(v!=null){t+=v;has=true}});return has?t:null};
  var mn=function(r){return r?r.mes:''};

  /* destaques */
  if(S.tri&&S.tri.data.length>=2){
    var tR=S.tri.data[S.tri.data.length-1],tP=S.tri.data[S.tri.data.length-2];
    var iR=num(colOf(tR,'interações')),iP=num(colOf(tP,'interações'));
    var sR=num(colOf(tR,'seguidores')),sP=num(colOf(tP,'seguidores'));
    var vR=num(colOf(tR,'visualizações')),vP=num(colOf(tP,'visualizações'));
    if(iR!=null&&iP!=null&&iR>iP){
      pos.push({t:'Melhor mês da história da marca',d:'Crescimento sobre o mês anterior em todas as frentes. Interações +'+pctd(iR,iP)+(sR!=null&&sP!=null?', seguidores +'+pctd(sR,sP):'')+(vR!=null&&vP!=null?', visualizações +'+pctd(vR,vP):'')+'. A marca acelera mês após mês.'});
    }
  }
  if(l&&p){
    var alcL=num(colOf(l,'alcance')),alcP=num(colOf(p,'alcance'));
    var intL=num(colOf(l,'interações')),intP=num(colOf(p,'interações'));
    var maxAlc=Math.max.apply(null,rows.map(function(r){return num(colOf(r,'alcance'))||0}));
    if(alcL!=null&&alcL>=maxAlc&&alcP!=null&&alcL>alcP){
      pos.push({t:'Alcance em máxima do período',d:mn(l)+' registrou o maior alcance da série ('+fmt.int(alcL)+' contas, +'+pctd(alcL,alcP)+' vs mês anterior), crescendo pelo segundo mês seguido'+(intL!=null&&intP!=null&&intL>intP?', com interações subindo '+pctd(intL,intP):'')+'. Mais pessoas únicas e relevantes vendo e respondendo à marca.'});
    }
  }
  var totNovos=somar('novos seguidores'),totInt=somar('interações'),totLink=somar('toques no link');
  if(totNovos!=null&&totNovos>0){
    pos.push({t:'Comunidade em plena construção',d:'+'+fmt.int(totNovos)+' novos seguidores no período'+(totInt!=null?', '+fmt.km(totInt)+' interações':'')+(totLink!=null?' e '+fmt.int(totLink)+' toques no link, sinal claro de intenção':'')+'. O desejo pela marca segue se convertendo em audiência própria.'});
  }

  /* a melhorar */
  if(f&&l&&f!==l){
    var visF=num(colOf(f,'visualizações')),visL=num(colOf(l,'visualizações'));
    if(visF!=null&&visL!=null&&visL<visF){
      warn.push({t:'Volume de visualizações em desaceleração',d:'De '+fmt.int(visF)+' em '+mn(f)+' para '+fmt.int(visL)+' em '+mn(l)+' (queda de '+pctd(visL,visF)+'). Recalibrar formatos de descoberta e frequência de distribuição pode retomar o volume de topo de funil.'});
    }
    var sf=function(r){var a=num(colOf(r,'novos seguidores')),b=num(colOf(r,'deixaram'));return a==null||b==null?null:a-b};
    var slF=sf(f),slL=sf(l);
    if(slF!=null&&slL!=null&&slL<slF){
      warn.push({t:'Ritmo de novos seguidores em queda',d:'Saldo passou de +'+fmt.int(slF)+' em '+mn(f)+' para +'+fmt.int(slL)+' em '+mn(l)+', com unfollows estáveis (a base construída é fiel). Reativar mecânicas de alcance a novos públicos, como collabs e formatos virais, para reacender a descoberta.'});
    }
    var vpF=num(colOf(f,'visitas no perfil')),vpL=num(colOf(l,'visitas no perfil'));
    var tlF=num(colOf(f,'toques no link')),tlL=num(colOf(l,'toques no link'));
    if(vpF!=null&&vpL!=null&&vpL<vpF){
      warn.push({t:'Tráfego ao perfil abaixo do pico',d:'Visitas ao perfil caíram de '+fmt.int(vpF)+' para '+fmt.int(vpL)+(tlF!=null&&tlL!=null&&tlL<tlF?' e toques no link de '+fmt.int(tlF)+' para '+fmt.int(tlL):'')+'. Reforçar chamadas para o perfil e para o link nos conteúdos de maior alcance.'});
    }

/* ---------- animações ---------- */
function countUp(el){
  var raw=parseFloat(el.getAttribute('data-raw')),fk=el.getAttribute('data-fmt');
  if(isNaN(raw)||!fmt[fk])return;
  var t0=null,dur=1200;
  function step(t){
    if(!t0)t0=t;
    var p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,4);
    el.textContent=fmt[fk](raw*e);
    if(p<1)requestAnimationFrame(step);
    else el.textContent=fmt[fk](raw);
  }
  requestAnimationFrame(step);
}
function countAll(){$$('[data-raw]').forEach(countUp)}
function initFx(){
  var els=$$('.rv');
  if(!('IntersectionObserver' in window)){countAll();return}
  els.forEach(function(el){el.classList.add('pre')});
  var counted={};
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        en.target.classList.add('in');
        Array.prototype.forEach.call(en.target.querySelectorAll('[data-raw]'),function(v){
          var k=v.getAttribute('data-raw')+v.className;
          if(!counted[k]){counted[k]=1;countUp(v)}
        });
        io.unobserve(en.target);
      }
    });
  },{threshold:0.12});
  els.forEach(function(el){io.observe(el)});
}

/* ---------- atualização via planilha ---------- */
function showErr(m){var el=$('#erro');el.textContent=m;el.style.display='block';setTimeout(function(){el.style.display='none'},8000)}
function readSheet(wb,name){
  var norm=function(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')};
  var key=Object.keys(wb.Sheets).filter(function(k){return norm(k)===norm(name)})[0];
  var ws=key?wb.Sheets[key]:null;
  if(!ws)return null;
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  var hi=-1;
  rows.some(function(r,i){if(r&&r.some(function(c){if(typeof c!=='string')return false;var cl=c.trim().toLowerCase();return cl.indexOf('mês')===0||cl.indexOf('trimestre')===0||cl.indexOf('período')===0})){hi=i;return true}return false});
  if(hi<0)return null;
  var heads=rows[hi].map(function(h){return h==null?'':String(h).toLowerCase()});
  var out=[];
  for(var i=hi+1;i<rows.length;i++){
    var r=rows[i];
    if(!r||r[0]==null||String(r[0]).trim()==='')continue;
    var o={mes:String(r[0])};
    heads.forEach(function(h,ci){if(ci>0&&r[ci]!=null)o[h]=r[ci]});
    out.push(o);
  }
  return {heads:heads,data:out};
}
